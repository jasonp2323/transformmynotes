name: Dependabot triage

# Weekly sweep over open Dependabot PRs: green ones have auto-merge enabled
# (gh pr merge --auto --squash, queued for GitHub to merge once required
# checks pass), red ones get a fix attempt on the PR branch followed by the
# same auto-merge queuing, and anything too risky to touch automatically
# (or that touches gated infra paths) gets a comment explaining why instead.

on:
  schedule:
    - cron: '0 9 * * 1'      # Monday 09:00 UTC
  workflow_dispatch:

# Broad enough for Claude to read PRs/checks/logs, push a fix commit to a
# dependabot branch, and comment — but no admin/repo-wide scopes.
permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read
  id-token: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Claude triage
        uses: anthropics/claude-code-action@v1
        with:
          # Auth: Anthropic workload identity federation (OIDC). The action
          # exchanges this workflow's GitHub Actions OIDC token for a
          # short-lived Anthropic token — there is no ANTHROPIC_API_KEY to
          # store or rotate. Requires `id-token: write` (granted above).
          #
          # These three are identifiers, not credentials, but they live in
          # repository *variables* rather than inline so this public repo
          # doesn't advertise the org/service-account IDs.
          #
          # Do NOT add anthropic_api_key or claude_code_oauth_token here — a
          # static credential takes precedence and silently bypasses OIDC.
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          # Optional — only needed if the federation rule spans more than one
          # workspace. Leave the variable unset otherwise; an empty value is
          # treated as absent.
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          # No github_token input: omitting it makes the action authenticate
          # as the Claude GitHub App instead of the workflow's GITHUB_TOKEN.
          # A GITHUB_TOKEN-authored push does not retrigger downstream CI on
          # the pushed commit (GitHub suppresses that to prevent workflow
          # loops); pushing as the Claude App does, so the fix commit below
          # actually gets a fresh check run instead of sitting untested.
          claude_args: |
            --max-turns 40
            --allowedTools "Bash,Read,Edit,Write,mcp__github__list_pull_requests,mcp__github__pull_request_read,mcp__github__get_check_run,mcp__github__get_job_logs,mcp__github__actions_list,mcp__github__actions_get,mcp__github__add_issue_comment"
          # ---------------------------------------------------------------
          # LIVE — auto-merge is enabled on the repo, and `deploy` +
          # `analyze (javascript-typescript)` are required checks in branch
          # protection on `master`. The prompt below runs the real command:
          #
          #     gh pr merge <n> --auto --squash
          #
          # `--auto` is mandatory: it queues the PR for GitHub to merge once
          # the required checks pass, rather than merging right now.
          # `--squash` is mandatory too: it makes the PR title the squash
          # commit message, which this repo's release-please tooling parses
          # to decide the version bump — never omit it.
          # ---------------------------------------------------------------
          prompt: |
            You are triaging Dependabot pull requests in this repository.
            Follow these steps in order, and the hard rules at the end.

            1. List open PRs authored by `dependabot[bot]`.

            2. For each such PR, check the status of the required checks on
               its head commit. The required checks are named exactly:
                 - `deploy` (from .github/workflows/deploy.yml — runs lint,
                   typecheck, unit tests, integration tests, and E2E)
                 - `analyze (javascript-typescript)` (from
                   .github/workflows/codeql.yml)

            3. If all required checks are green, this PR qualifies for
               auto-merge.
               Run `gh pr merge <n> --auto --squash` on this PR to queue it
               for GitHub to merge automatically once the required checks
               pass. Never merge via the API, and never a bare
               `gh pr merge` without `--auto`. Note in the run log, in one
               line per PR, what you enabled (e.g. "PR #123 — deploy and
               analyze (javascript-typescript) are both green; enabled
               auto-merge.").

            4. If checks are failing, investigate:
               - Read the failing job's logs to find the breaking change.
               - Fix the breaking change directly on the PR branch (e.g. a
                 changed API surface, a renamed config option, a type
                 change from the bumped dependency).
               - Validate locally by running, in order: `npm run lint`,
                 `npm run typecheck`, `npm run test:unit`. All three must
                 pass before you commit.
               - Commit with a Conventional Commit message, e.g.
                 `fix(deps): update usage for <package> vX`.
               - Push the fix commit to the PR's existing branch (not a new
                 branch, not master).
               - After pushing, run `gh pr merge <n> --auto --squash` on
                 this PR so CI re-runs on the fix commit and GitHub merges
                 it only if the required checks go green.

            5. If the fix would require a non-trivial refactor, or the PR is
               a major version bump with real API/behavior changes you
               cannot safely patch mechanically: do NOT attempt the fix.
               Instead post a comment on the PR explaining precisely what
               broke — the failing check name, the exact error, and the
               file(s) involved — and stop there for that PR.

            Hard rules, no exceptions:
              - Never force-push.
              - Never push to or otherwise modify `master`.
              - Never touch, comment on, or modify any PR not authored by
                `dependabot[bot]`.
              - Never skip, disable, comment out, or delete a test (or
                loosen an assertion) just to make a check go green.
              - Never enable auto-merge on a PR whose diff touches
                `infra/**` or `sst.config.ts` — infra changes are
                human-gated in this repo because of AWS cost impact (a
                dependency bump normally won't touch these, but a bumped
                SST or CDK package can pull infra changes in). Instead
                comment on the PR explaining which infra paths it touches
                and leave it for a human.
