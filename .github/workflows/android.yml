name: Android

# Builds the signed Android release APK and publishes it.
#   - push of a `mobile-v*` tag → build, upload artifact, and attach the APK
#     to the GitHub Release for that tag.
#   - workflow_dispatch → build and upload the artifact only (no tag/release).
#
# Completely independent of deploy.yml: no SST, AWS, or Cloudflare steps. A
# `mobile-v*` tag push does NOT trigger deploy.yml (which only runs on master
# pushes / PRs).

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:

# Never cancel an in-flight release build — a partial APK publish is worse
# than a queued duplicate.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # Required to attach the built APK to the GitHub Release for the tag.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Mapped from repo secrets so the keystore + signing material never
      # appear in the workflow source. The presence check below fails loudly
      # if any is empty.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify signing secrets are present
        # Fail loudly (not silently skip) if any of the four signing secrets
        # is empty or absent. An unsigned/misconfigured release build must
        # never silently succeed.
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required signing secret '${name}' is empty or absent."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more required Android signing secrets are missing — aborting."
            exit 1
          fi

      - name: Decode release keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/release.jks

      - name: Capacitor sync (Android)
        # CAPACITOR_SERVER_URL unset → the shell points at the production URL
        # (https://app.transformmynotes.com).
        working-directory: packages/mobile
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: packages/mobile/android
        run: chmod +x ./gradlew

      - name: Build signed release APK
        working-directory: packages/mobile/android
        run: |
          ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE=/tmp/release.jks \
            -PRELEASE_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: packages/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Attach APK to GitHub Release
        # Only on a tag push — workflow_dispatch has no tag/release to attach to.
        # This action creates the release for the tag if it does not yet exist.
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/mobile/android/app/build/outputs/apk/release/app-release.apk
