<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1030" width="1240" height="1030" role="img" aria-labelledby="title desc">
<title id="title">TransformMyNotes cloud and application architecture</title>
<desc id="desc">Browser and Android clients reach a single Amazon CloudFront router (behind Cloudflare DNS) that fronts two Next.js apps: the public Marketing site and the authenticated Application. The Application verifies JWTs against Amazon Cognito, reads and writes a single-table DynamoDB and an S3 bucket, and calls Amazon Bedrock for OCR and Amazon Polly for text-to-speech. DynamoDB Streams drive Lambda consumers (study-material generation, source extraction, usage and progress aggregation, scheduled crons) and the study-generation consumer also calls Bedrock. Resend sends transactional email and SSM Parameter Store holds secrets. GitHub Actions deploys via OIDC to AWS using SST.</desc>
