<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're offline — TransformMyNotes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FAF8F3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #1a1a1a;
      padding: 24px 16px;
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 12px;
      line-height: 1.2;
    }
    p {
      font-size: 1rem;
      color: #555555;
      max-width: 340px;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #16747e;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: background 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover {
      background: #125f68;
    }
    button:active {
      background: #0f4f57;
    }
  </style>
</head>
<body>
  <!-- Inline SVG logo (copied from packages/application/public/assets/logo-mark.svg) -->
